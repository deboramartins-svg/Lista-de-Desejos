<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Botão de Alternar Tema -->
    <button id="themeToggleBtn" title="Alternar Tema">☀️</button>

    <div class="grid-3d"></div>

    <main class="container">
        <header class="header">
            <h1>✰ Lista de Compras ✰</h1>
        </header>

        <div class="add-box">
            <input type="text" id="newItemInput" placeholder="Adicionar desejo..." autocomplete="off">
            <button id="addItemBtn">+</button>
        </div>

        <div class="projects-grid" id="shoppingGrid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
